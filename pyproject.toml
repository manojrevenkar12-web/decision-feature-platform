[project]
name = "decision-feature-platform"
version = "1.0.0"
description = "Real-time features for credit and fraud decisions on AWS serverless"
requires-python = ">=3.12"
authors = [{ name = "Manoj Kumar Prakash", email = "manojrevenkar12@gmail.com" }]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "fastapi>=0.110",
  "pydantic>=2.5",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pyarrow>=15",
  "pyiceberg[sql-sqlite,pyiceberg-core]>=0.10",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "redis>=5", "mangum>=0.17", "psycopg[binary]>=3.1"]
report = ["matplotlib>=3.8"]
dev = [
  "boto3>=1.34",
  "redis>=5",
  "mangum>=0.17",
  "psycopg[binary]>=3.1",
  "matplotlib>=3.8",
  "moto[dynamodb]>=5",
  "fakeredis>=2.20",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "cfn-lint>=1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
